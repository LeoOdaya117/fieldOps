name: tests

on:
  pull_request:
    branches:
      - develop
      - main
      - staging

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fieldops
      DB_USERNAME: fieldops
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: database
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_USER_EMAIL: test@example.com
      E2E_USER_PASSWORD: password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fieldops
          MYSQL_USER: fieldops
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          tools: composer:v2
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.3-
            composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure CI application environment
        shell: bash
        run: |
          cp .env.example .env

          set_env() {
            key="$1"
            value="$2"

            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          set_env APP_ENV "$APP_ENV"
          set_env APP_URL "$APP_URL"
          set_env DB_CONNECTION "$DB_CONNECTION"
          set_env DB_HOST "$DB_HOST"
          set_env DB_PORT "$DB_PORT"
          set_env DB_DATABASE "$DB_DATABASE"
          set_env DB_USERNAME "$DB_USERNAME"
          set_env DB_PASSWORD "$DB_PASSWORD"
          set_env CACHE_STORE "$CACHE_STORE"
          set_env SESSION_DRIVER "$SESSION_DRIVER"

      - name: Setup Application
        run: composer setup

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run CI Checks
        run: composer ci:check

      - name: Seed browser test user
        run: php artisan db:seed --force

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start application for browser tests
        shell: bash
        run: |
          (cd public && php -S 127.0.0.1:8000 -t . ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > ../storage/logs/e2e-server.log 2>&1) &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Run browser tests
        run: npm run test:e2e

      - name: Generate coverage report
        run: php artisan test --coverage --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-php-8.3
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
