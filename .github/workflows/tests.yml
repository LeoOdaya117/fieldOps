name: tests

on:
  pull_request:
    branches:
      - develop
      - main
      - staging

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php-version }}-
            composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Application
        run: composer setup

      - name: Seed browser test user
        if: matrix.php-version == '8.3'
        run: php artisan db:seed --force

      - name: Audit Composer dependencies
        if: matrix.php-version == '8.3'
        run: composer audit --locked --no-interaction

      - name: Audit npm dependencies
        if: matrix.php-version == '8.3'
        run: npm audit --audit-level=high

      - name: Run CI Checks
        run: composer ci:check

      - name: Install Playwright browser
        if: matrix.php-version == '8.3'
        run: npx playwright install --with-deps chromium

      - name: Start application for browser tests
        if: matrix.php-version == '8.3'
        shell: bash
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Run browser tests
        if: matrix.php-version == '8.3'
        run: npm run test:e2e

      - name: Generate coverage report
        run: php artisan test --coverage --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-php-${{ matrix.php-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload browser test report
        if: always() && matrix.php-version == '8.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
