name: Database backup rehearsal

on:
  pull_request:
    branches: [develop, main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.4
            engine: mysql
            major: 8
            client: mysql
          - image: mariadb:11.4
            engine: mariadb
            major: 11
            client: mariadb
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: backup-fixture
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: backup-fixture
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build application and engine clients
        run: docker build -f docker/php/Dockerfile -t fieldops-backup-rehearsal .

      - name: Wait for the disposable database and stop events
        env:
          DATABASE_CONTAINER: ${{ job.services.database.id }}
          DATABASE_CLIENT: ${{ matrix.client }}
        run: |
          for attempt in $(seq 1 60); do
            if docker exec "$DATABASE_CONTAINER" sh -c 'MYSQL_PWD=backup-fixture "$1" -u root -e "SET GLOBAL event_scheduler=OFF"' sh "$DATABASE_CLIENT"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Rehearse signed backup, CLI restore, and interrupted recovery
        env:
          BACKUP_TEST_ENGINE: ${{ matrix.engine }}
          BACKUP_TEST_SERVER_MAJOR: ${{ matrix.major }}
        run: |
          docker run --rm --network host --entrypoint sh \
            -v "$PWD:/var/www/html" \
            -e APP_ENV=testing \
            -e APP_KEY=base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e BACKUP_INTEGRATION=1 \
            -e BACKUP_TEST_ENGINE -e BACKUP_TEST_SERVER_MAJOR \
            -e BACKUP_TEST_HOST=127.0.0.1 -e BACKUP_TEST_PORT=3306 \
            -e BACKUP_TEST_USERNAME=root -e BACKUP_TEST_PASSWORD=backup-fixture \
            -e BACKUP_TEST_MYSQL_DUMP=/usr/local/bin/fieldops-mysqldump \
            -e BACKUP_TEST_MYSQL_CLIENT=/usr/local/bin/fieldops-mysql \
            -e BACKUP_TEST_MARIADB_DUMP=/usr/bin/mariadb-dump \
            -e BACKUP_TEST_MARIADB_CLIENT=/usr/bin/mariadb \
            fieldops-backup-rehearsal -lc \
            'composer install --no-interaction --prefer-dist --no-scripts && php vendor/bin/phpunit --filter=DatabaseBackupIntegrationTest'
